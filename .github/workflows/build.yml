name: Build and Test PrismOS

# v0.1: カーネル + ISO ビルド、シェルのホストテスト、
# QEMU での起動テスト (バナーとシェル出力を確認)。
# Limine は 8.3.2-binary タグに固定 (Makefile 参照)。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc make curl xorriso mtools qemu-system-x86 xz-utils

      - name: Run shell unit tests (host)
        run: make test

      - name: Build kernel and ISO
        run: make

      - name: Boot test in QEMU
        run: make boot-test

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: prismos-iso
          path: build/prismos.iso
          if-no-files-found: error
