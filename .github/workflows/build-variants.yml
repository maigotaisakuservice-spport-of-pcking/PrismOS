# PrismOS — 5 種ビルドの検証ワークフロー (テストブランチ用)
#
# 目的: 5 種のビルド成果物 (64bit / 32bit / ARM / Live USB /
# 仮想環境) を全部ビルドし、それぞれ QEMU で起動テストする。
# チェックリスト項目 11 (GitHub Actions で確認) のための
# テストブランチ専用ファイルで、main の build.yml には
# 一切触らない (build.yml は別に存在し、そちらが本流)。
#
# 注意:
# - このファイルは GitHub API (Muse アプリ) ではプッシュ
#   できない (403)。ブラウザの Web UI から追加すること。
# - scripts/pq-private-key.pem は絶対にコミットしない
#   (.gitignore 済み)。そのため ISO 署名 (iso-sign /
#   checklist) は CI では行わない。署名はローカルで行う。
# - CI の QEMU / gcc はローカルと版が違う (run #10 時点で
#   QEMU 10.2.1 / gcc 15.2.0)。64bit の起動テストが CI で
#   失敗する既知の問題 (run #1〜#10) が再現するかどうかは
#   このワークフローの boot-test が教えてくれる。

name: build-variants

on:
  workflow_dispatch:
  push:
    branches:
      - test-build-matrix

jobs:
  host-tests:
    name: host unit tests + asm check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools qemu-system-x86 \
            qemu-system-arm gcc-aarch64-linux-gnu
          # CVE-2026-133949: pip 26.2.2 未満は侵害された eMudhra 証明書を
          # 信頼する。cryptography の取得前に pip 自体を更新する。
          python3 -m pip install --upgrade "pip>=26.2.2"
          python3 -m pip install cryptography
      - name: Host unit tests
        run: make test
      - name: No SSE/FP instructions in kernel
        run: make check-asm

  variant-64bit:
    name: 64-bit ISO + boot/desktop tests
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools qemu-system-x86
      - name: Build ISO
        run: make iso
      - name: Boot test
        run: make boot-test
      - name: Desktop test
        run: make desktop-test
      - name: Compat sandbox test
        run: make compat-test
      - name: Upload ISO and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prismos-64bit
          path: |
            build/prismos.iso
            build/boot.log
            build/boot-desktop.log
            build/boot-compat.log

  variant-live-usb:
    name: Live USB image + USB boot test
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools qemu-system-x86
      - name: Build Live USB image
        run: make live-usb
      - name: USB boot test
        run: make live-usb-test
      - name: Upload image and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prismos-live-usb
          path: |
            build/prismos-live-usb.img
            build/live-usb.log

  variant-vm:
    name: VM image (qcow2) + boot test
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools qemu-system-x86 \
            qemu-utils
      - name: Build VM image
        run: make vm-image
      - name: VM boot test
        run: make vm-test
      - name: Upload image and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prismos-vm
          path: |
            build/prismos-vm.qcow2
            build/vm.log

  variant-32bit:
    name: 32-bit ISO + boot test
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools qemu-system-x86 \
            gcc-multilib
      - name: Build 32-bit ISO
        run: make iso32
      - name: 32-bit boot test
        run: make boot32-test
      - name: Upload ISO and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prismos-32bit
          path: |
            build/prismos-32.iso
            build/boot32.log

  variant-arm:
    name: ARM kernel + boot/screen/disk/net tests
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm \
            gcc-aarch64-linux-gnu
      - name: Build ARM kernel
        run: make arm-kernel
      - name: ARM boot test
        run: make arm-boot-test
      - name: ARM screen test
        run: make arm-screen-test
      - name: ARM disk test
        run: make arm-disk-test
      - name: ARM net test
        run: make arm-net-test
      - name: Upload kernel and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prismos-arm
          path: |
            build/kernel-arm.elf
            build/kernel-arm.bin
            build/arm-boot.log
            build/arm-disk.log
            build/arm-net.log
