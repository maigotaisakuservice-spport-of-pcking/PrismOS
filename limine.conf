# PrismOS — Limine 設定 (Limine 8.3.2)
#
# timeout: 0 で最初のエントリを即ブートする。
# serial: yes はブートローダのメニュー用。カーネル自体は
# COM1 を 115200 baud で初期化し直して使う。
timeout: 0
quiet: no
serial: yes
serial_baudrate: 115200
default_entry: 1

/PrismOS
    protocol: limine
    kernel_path: boot():/boot/prismos.elf
    comment: PrismOS 0.1.0 — Windows 11-style UI, Mac-style features
