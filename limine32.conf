# PrismOS — Limine 設定 (32bit 版、Limine 8.3.2)
#
# 32bit 版カーネルは Limine プロトコルではなく Multiboot1 で
# 起動する。ブートローダは 32bit プロテクトモードでカーネルに
# 入るので、long mode を持たない CPU でも起動できる。
timeout: 0
quiet: no
serial: yes
serial_baudrate: 115200
default_entry: 1

/PrismOS 32-bit
    protocol: multiboot1
    kernel_path: boot():/boot/prismos32.elf
    comment: PrismOS 27H1 32-bit — Multiboot1, no long mode
